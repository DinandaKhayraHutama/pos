<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JustClick POS — Point of Sale untuk restoran dan FnB.">
  <!-- Default brand primary (BrandPreset.presets[0]); keep in sync with manifest.json. -->
  <meta name="theme-color" content="#1E40AF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JustClick POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JustClick POS</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Receipt printing on web goes through package:printing, which renders the
    PDF preview with pdf.js. Left alone it fetches pdf.js from unpkg.com at the
    moment the cashier taps "Print receipt" — so printing would break on a
    machine with no internet, and a demo behind a tunnel would depend on a
    third-party CDN answering in time. `dartPdfJsBaseUrl` is the package's own
    override hook; the library is vendored under web/pdfjs/ (version must stay
    3.2.146, the version printing 5.14.3 expects) so the app stays one
    self-contained static bundle.
  -->
  <script>window.dartPdfJsBaseUrl = "pdfjs/";</script>

  <!--
    Boot splash. The compiled bundle is a few megabytes, so over a tunnel the
    page sat on blank white until Flutter painted its first frame — which reads
    as "the link is broken" to whoever was sent it. This paints instantly from
    HTML, using the default brand's gradient so it hands over to the app's own
    substrate without a flash. Removed on `flutter-first-frame`.

    THE ONE PLACE BRAND COLOURS ARE DUPLICATED, and unavoidably so: this markup
    runs before any Dart has loaded, so it cannot read `BrandColors`. The
    values below mirror the `nti` preset in lib/core/theme/app_colors.dart:

      #1E40AF  accent.primary          (mark, progress bar, theme-color)
      #1E3A8A  darker primary          (wordmark)
      #F1F5FB  accent.gradient[0]      (page background, gradient start)
      #DCE6F7  accent.gradient[1]      (gradient end)

    Plus #FFFFFF for the mark's plate, which is not a brand token: the
    JustClick logo is a blue-and-grey shape on transparency and needs a light
    ground under it. It mirrors `BrandMark.plated`, which resolves the same
    plate from `colorScheme.onPrimary`.

    Change the default brand and these have to move with it, or the first
    second of the app is the old colour. Nothing else outside
    lib/core/theme/ may hardcode a colour.
  -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F1F5FB; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      background: linear-gradient(160deg, #F1F5FB 0%, #DCE6F7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .mark {
      width: 88px; height: 88px; border-radius: 24px; background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(30, 64, 175, .28);
    }
    #boot .mark img { width: 60px; height: 60px; display: block; }
    #boot .name {
      font-size: 20px; font-weight: 700; letter-spacing: .14em; color: #1E3A8A;
    }
    #boot .bar {
      width: 132px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(30, 64, 175, .18);
    }
    #boot .bar i {
      display: block; width: 40%; height: 100%; border-radius: 3px; background: #1E40AF;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
