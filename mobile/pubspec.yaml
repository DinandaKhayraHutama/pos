name: nti_pos
description: "JustClick POS - Restaurant Point of Sale mobile application for FnB businesses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Local database (swappable with REST API later)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Persistence (theme/locale/last session)
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  crypto: ^3.0.6

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  sqflite_common_ffi_web: ^1.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  web: ^1.1.1
  bcrypt: ^1.2.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  generate: true
  # The brand mark, and the only bundled image in the app — every product photo
  # is a remote URL. See lib/core/widgets/brand_mark.dart.
  assets:
    - assets/images/justclick_logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/plus_jakarta/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
