name: justclick

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-justclick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-justclick}
    ports:
      # 5433 on the host: 5432 belongs to the native PostgreSQL 18 install.
      - "127.0.0.1:5433:5432"
    volumes:
      # 18+ images want the mount one level up, at /var/lib/postgresql, and
      # place the cluster in a major-version subdirectory themselves. Mounting
      # .../data instead makes the container refuse to start.
      - pgdata:/var/lib/postgresql
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - max_connections=200
      # Tuning, sized for the pilot box (8 vCPU / 32 GB) and overridable in
      # .env for a smaller development machine. The defaults below are the
      # plan's, halved where a laptop would otherwise swap.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${PG_WORK_MEM:-12MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      # NVMe, not spinning rust: the planner should stop preferring sequential
      # scans over the covering indexes every pull depends on.
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=zstd
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_timeout=15min
      # This is money. A crash must not be able to lose an acknowledged sale,
      # so synchronous_commit stays on — never loosen it for a benchmark.
      - -c
      - synchronous_commit=on
      # orders is append-heavy and partitioned; the rollup tables are rewritten
      # slice by slice. Both want autovacuum to start long before the default
      # 20% of the table is dead.
      - -c
      - autovacuum_vacuum_scale_factor=0.02
      - -c
      - autovacuum_analyze_scale_factor=0.01
      - -c
      - autovacuum_max_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-justclick} -d ${POSTGRES_DB:-justclick}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # noeviction, never LRU: silently evicting a rate-limit key is a bypass.
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  api:
    build: .
    restart: unless-stopped
    environment:
      # Inside the network Postgres is reachable by service name on 5432; the
      # 5433 in .env is the host-side mapping only.
      #
      # The serving process gets the tenant credential and the escape hatch,
      # and deliberately NOT the owner: DDL and cross-tenant table ownership
      # are not privileges an HTTP handler should be one bug away from.
      DATABASE_URL: postgres://justclick_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-justclick}?sslmode=disable
      UNSCOPED_DATABASE_URL: postgres://justclick_unscoped:${UNSCOPED_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-justclick}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      HTTP_ADDR: ":9000"
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Widening this and restarting is how the fleet's polling is throttled
      # during an incident, without shipping an app release.
      SYNC_POLL_INTERVAL: ${SYNC_POLL_INTERVAL:-60s}
      # Product images: written to the shared volume, served by Caddy under
      # /media. In production this is the public https hostname tills reach.
      MEDIA_DIR: /var/lib/justclick/media
      MEDIA_PUBLIC_BASE_URL: https://localhost:8443/media
      # Report exports: written by the worker, served to signed-in employees and
      # e-mailed links by the API. Both mount the same private volume.
      REPORTS_DIR: /var/lib/justclick/reports
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}
      GOTENBERG_URL: ${GOTENBERG_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Prometheus reaches this by service name on the internal network. It is
      # deliberately not published and Caddy does not proxy it: /metrics names
      # every internal queue.
      METRICS_ADDR: ":9090"
      # Sized against PostgreSQL's max_connections, not against the container's
      # CPU count, which is what pgx would otherwise use.
      PG_MAX_CONNS: ${PG_MAX_CONNS:-25}
      PG_UNSCOPED_MAX_CONNS: ${PG_UNSCOPED_MAX_CONNS:-10}
      PG_MIN_CONNS: ${PG_MIN_CONNS:-2}
    # The code drains for 30s on SIGTERM; Docker's default is to SIGKILL at
    # 10, so every deploy used to cut in-flight requests in a third of the
    # time the process believed it had.
    stop_grace_period: 35s
    volumes:
      - media:/var/lib/justclick/media
      - reports:/var/lib/justclick/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: justclick-api
    command: ["worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://justclick_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-justclick}?sslmode=disable
      UNSCOPED_DATABASE_URL: postgres://justclick_unscoped:${UNSCOPED_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-justclick}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REPORTS_DIR: /var/lib/justclick/reports
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}
      GOTENBERG_URL: ${GOTENBERG_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # The worker publishes the fleet-wide gauges: River queues and dead
      # jobs, rollup staleness, devices seen, DEFAULT partition occupancy.
      METRICS_ADDR: ":9090"
      PG_MAX_CONNS: ${WORKER_PG_MAX_CONNS:-10}
      PG_UNSCOPED_MAX_CONNS: ${WORKER_PG_UNSCOPED_MAX_CONNS:-10}
      PG_MIN_CONNS: ${PG_MIN_CONNS:-2}
    volumes:
      - reports:/var/lib/justclick/reports
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy

  # PDF rendering for report exports. Opt in with `--profile reports` and set
  # GOTENBERG_URL=http://gotenberg:3000; without it a PDF export fails with a
  # message and CSV/XLSX still work. Never published to the host.
  gotenberg:
    image: gotenberg/gotenberg:8.20.1
    restart: unless-stopped
    profiles: ["reports"]

  # A local inbox for scheduled report e-mail during development: set
  # SMTP_HOST=mailpit, SMTP_PORT=1025, MAIL_FROM=laporan@localhost, and read
  # the mail at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    profiles: ["reports"]
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
      # Dev only: the till web build and the device API on one origin.
      - "127.0.0.1:8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Read-only: Caddy serves images, only the API writes them.
      - media:/srv/media:ro
      # The Flutter web build, for walking the connected flow in a browser.
      # Missing on a fresh clone until `flutter build web` has run; Caddy
      # answers 404 until then rather than failing to start.
      - ../mobile/build/web:/srv/till:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

  # ---- Observability -------------------------------------------------------
  #
  # Opt in with `docker compose --profile observability up -d`. Nothing here is
  # on the request path; losing it costs the dashboard, not the service.
  #
  # Only Grafana is published, on loopback. Prometheus and the exporters are
  # reachable inside the network only: their endpoints name every internal
  # queue, table and connection string fragment.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:12.4.11
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      # Left empty rather than required: Compose interpolates the whole file
      # even for services outside the profile, so `${…:?}` here would stop
      # `docker compose up api` on a machine that never runs the dashboard.
      # Unset, Grafana falls back to admin/admin on loopback — set it in .env
      # anywhere that is not a laptop.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      # Nobody signs up for an operations dashboard.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # Reads pg_stat_* as justclick_metrics, a role with pg_monitor and nothing
  # else: an exporter holding the owner credential would be a superuser
  # connection kept open for the convenience of a graph.
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgres://justclick_metrics:${METRICS_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-justclick}?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    # The per-table collectors are switched off, and this is a measured
    # decision, not a preference: their query costs ~80 ms per scrape here and
    # grows with the number of relations — and this schema grows a handful of
    # partitions every month. During the Fase 9 run it was the single most
    # expensive statement in the database and it moved p99 of /sync/changes
    # from 5.9 ms to 31.5 ms. Autovacuum and table sizes matter, but they are a
    # question for a minute, not for every fifteen seconds; the load harness
    # reads them straight from pg_stat_user_tables when a run needs them.
    command:
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    depends_on:
      postgres:
        condition: service_healthy

  redis_exporter:
    image: oliver006/redis_exporter:v1.91.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    depends_on:
      - redis

  # Disk, memory and CPU. On a VPS this is the box; on Docker Desktop it is the
  # Linux VM, which makes the disk alert indicative rather than exact.
  node_exporter:
    image: prom/node-exporter:v1.12.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      # Plain :ro, not :ro,rslave. rslave is the usual recipe and is better on
      # a Linux VPS (it picks up filesystems mounted after the exporter
      # starts), but Docker Desktop refuses it — "path / is mounted on / but it
      # is not a shared or slave mount" — and the dashboard would then be
      # missing exactly on the machine where it is being built.
      - /:/host:ro

volumes:
  pgdata:
  prometheusdata:
  grafanadata:
  # Uploaded product images. Not covered by pgBackRest — back it up
  # alongside the database.
  media:
  # Report export files. Short-lived deliveries (kept 30 days), not an archive:
  # the rollups in PostgreSQL are what is backed up.
  reports:
  redisdata:
  caddydata:
  caddyconfig:
