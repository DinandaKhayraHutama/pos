        delta_qty: {type: integer, format: int64, minimum: -1000000, maximum: 1000000}
        counted_qty: {type: integer, format: int64, minimum: 0, maximum: 1000000, nullable: true}
        basis_seq: {type: integer, format: int64, minimum: 0, nullable: true}
        occurred_at_ms: {$ref: '#/components/schemas/Millis'}
        employee_id: {type: string, nullable: true}
        employee_name: {type: string, maxLength: 120}
        note: {type: string, nullable: true, maxLength: 200}
