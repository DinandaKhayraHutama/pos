      properties:
        promo_id: {type: string}
        outlet_id: {type: string}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    StockMovement:
      type: object
      additionalProperties: false
      description: |
        One immutable ledger movement, applied at the token's outlet. delta_qty
        is signed: sale and waste negative, voidReturn and received positive,
        correction and opening non-zero. A count carries counted_qty; the server
        replaces its delta_qty with counted_qty minus the server's current
        quantity (server wins). An exact retry, including one at a newer
        revision, is accepted with the originally recorded result.
      required: [id, revision, product_id, product_name, reason, delta_qty, occurred_at_ms, employee_name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        product_id: {$ref: '#/components/schemas/UUID'}
        product_name: {type: string, minLength: 1, maxLength: 120}
        reason: {type: string, enum: [sale, voidReturn, received, waste, correction, opening, count]}
        delta_qty: {type: integer, format: int64, minimum: -1000000, maximum: 1000000}
        counted_qty: {type: integer, format: int64, minimum: 0, maximum: 1000000, nullable: true}
        basis_seq: {type: integer, format: int64, minimum: 0, nullable: true}
        occurred_at_ms: {$ref: '#/components/schemas/Millis'}
        employee_id: {type: string, nullable: true}
        employee_name: {type: string, maxLength: 120}
        note: {type: string, nullable: true, maxLength: 200}
    OutletStockRow:
      type: object
      required: [outlet_id, product_id, qty_on_hand, sync_seq, deleted_at_ms]
      properties:
        outlet_id: {type: string}
        product_id: {type: string}
        qty_on_hand: {type: integer, format: int64}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    StockMovementRow:
      type: object
      required: [id, outlet_id, product_id, product_name, reason, delta_qty, counted_qty, balance_after, occurred_at_ms, employee_name, note, source, stock_seq, sync_seq, deleted_at_ms]
      properties:
        id: {type: string}
        outlet_id: {type: string}
        product_id: {type: string}
        product_name: {type: string}
        reason: {type: string}
        delta_qty: {type: integer, format: int64}
        counted_qty: {type: integer, format: int64, nullable: true}
        balance_after: {type: integer, format: int64}
        occurred_at_ms: {type: integer, format: int64}
        employee_name: {type: string}
        note: {type: string, nullable: true}
        source: {type: string}
        stock_seq: {type: integer, format: int64}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    TableStatusEvent:
      type: object
      additionalProperties: false
      description: |
        One immutable change of a table's live status, applied at the token's
        outlet. basis_seq is the table_status sync_seq the till had pulled for
        the table when it made the change (0 if it had none). An event made
        against the current sequence, or following the same device's own latest
        write, applies. One that raced another till's write is applied or
        superseded by occurred_at_ms (the event id breaks a tie) and marks the
        table contested; the next uncontested change clears the mark. An exact
        retry, including one at a newer revision, is accepted with the
        originally recorded result. client_seq orders this device's events even
        across clock corrections or reordered delivery; an older number is
        recorded as superseded. Tills number events max(previous + 1, wall-clock
        milliseconds), so a store reinstalled under the same device never reuses
        a number. A basis_seq ahead of the current table projection is refused.
      required: [id, revision, table_id, status, client_seq, basis_seq, occurred_at_ms, employee_name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        table_id: {$ref: '#/components/schemas/UUID'}
        client_seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic per-device per-table event number, persisted offline. Older events never undo a later event from the same device.
        status: {type: string, enum: [available, occupied, reserved]}
        basis_seq: {type: integer, format: int64, minimum: 0}
        occurred_at_ms: {$ref: '#/components/schemas/Millis'}
        employee_name: {type: string, maxLength: 120}
    TableRow:
      type: object
      required: [id, outlet_id, name, area, capacity, pos_x, pos_y, sort_order, active, sync_seq, deleted_at_ms]
      properties:
        id: {type: string}
        outlet_id: {type: string}
        name: {type: string}
        area: {type: string}
        capacity: {type: integer, format: int64}
        pos_x: {type: integer, format: int64, nullable: true}
        pos_y: {type: integer, format: int64, nullable: true}
        sort_order: {type: integer, format: int64}
        active: {type: boolean}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    TableStatusRow:
      type: object
      required: [table_id, outlet_id, status, occurred_at_ms, employee_name, contested, sync_seq, deleted_at_ms]
      properties:
        table_id: {type: string}
        outlet_id: {type: string}
        status: {type: string}
        occurred_at_ms: {type: integer, format: int64}
        employee_name: {type: string}
        contested: {type: boolean}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
