        outlet_id: {type: string}
        name: {type: string}
        area: {type: string}
        capacity: {type: integer, format: int64}
        pos_x: {type: integer, format: int64, nullable: true}
        pos_y: {type: integer, format: int64, nullable: true}
        sort_order: {type: integer, format: int64}
        active: {type: boolean}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    TableStatusRow:
      type: object
      required: [table_id, outlet_id, status, occurred_at_ms, employee_name, contested, sync_seq, deleted_at_ms]
