        A customer a till pushes up, created either at the counter or in the
        Backoffice. Insert-only on arrival — id is chosen by whichever side
        creates the row and is also its idempotency key; an id that already
        exists is accepted and left alone (ON CONFLICT DO NOTHING), never
        overwritten. There is no revision here because there is nothing to
        revise: editing an existing customer is a Backoffice-only action this
        entity does not carry, so a till never has to reconcile a second
        writer's edit against its own.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, nullable: true, maxLength: 32}
        email: {type: string, nullable: true, maxLength: 255}
        address: {type: string, nullable: true, maxLength: 255}
        note: {type: string, nullable: true, maxLength: 500}
    CustomerRow:
      type: object
      required: [id, name, phone, email, address, note, active, sync_seq, deleted_at_ms]
      properties:
        id: {type: string}
        name: {type: string}
        phone: {type: string, nullable: true}
        email: {type: string, nullable: true}
        address: {type: string, nullable: true}
        note: {type: string, nullable: true}
        active: {type: boolean}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    ProductRow:
      type: object
      required: [id, category_id, name, price, cost, sku, tax_rate, description, image_url, icon_key, available, is_popular, sort_order, brand_id, sync_seq, deleted_at_ms]
      properties:
        id: {type: string}
        category_id: {type: string, nullable: true}
        name: {type: string}
        price: {type: integer, format: int64}
        cost: {type: integer, format: int64, nullable: true}
        sku: {type: string, nullable: true}
        tax_rate: {type: number, nullable: true}
        description: {type: string, nullable: true}
        image_url: {type: string, nullable: true}
        icon_key: {type: string, nullable: true}
        available: {type: boolean}
        is_popular: {type: boolean}
        sort_order: {type: integer, format: int64}
        brand_id: {type: string, nullable: true}
        sync_seq: {type: integer, format: int64}
        deleted_at_ms: {type: integer, format: int64, nullable: true}
    VariantRow:
