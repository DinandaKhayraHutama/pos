        customer_name: {type: string, nullable: true}
        subtotal: {$ref: '#/components/schemas/Money'}
        line_count: {type: integer}
        opened_at_ms: {$ref: '#/components/schemas/Millis'}
        updated_at_ms: {$ref: '#/components/schemas/Millis'}
        dispatches:
          type: object
          description: How many of the bill's dispatches are at each kitchen status.
          additionalProperties: {type: integer}
    TillDispatchSummary:
      type: object
      required: [id, revision, status, occurred_at_ms, employee_name, status_changed_at_ms, line_ids]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64}
        status: {type: string, enum: [queued, preparing, ready, served, cancelled]}
        occurred_at_ms: {$ref: '#/components/schemas/Millis'}
