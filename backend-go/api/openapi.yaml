openapi: 3.0.3
info:
  title: JustClick Device API
  version: 2.9.0
  description: |
    Frozen baseline for Flutter v2, extended additively in 2.1.0 with the stock
    ledger (Fase 5): the outlet-scoped feeds outlet_stock and stock_movements,
    pushable stock_movements, and stock_seq/balance_after on push results; in
    2.2.0 with the floor plan (Fase 6): the outlet-scoped feeds tables and
    table_status, pushable table_status_events, and status_seq/outcome on push
    results; and in 2.3.0 with plan limits (Fase 8): POST /devices/activate may
    answer 422 device_limit_reached when the business already runs as many
    active devices as its plan allows. Like invalid_code it does not activate
    and does not consume the code; the same code works once a device is revoked.
    A suspended business answers 401 unauthenticated on every authenticated
    route, exactly as a revoked device does.
    2.5.0 extends transaction visibility and reporting (Fase 1 paritas),
    additively: GET /till/orders keeps day and before and gains from, to,
    status, receipt_number, cashier_id and scope, and echoes the scope and
    range it actually applied; day combined with from/to is refused as
    ambiguous_range rather than resolved. Two read-only report endpoints are
    added, GET /till/reports/summary for viewDailySummary and
    GET /till/reports/sales for viewFinancialReports; both take the cashier
    token, both answer Cache-Control no-store, and cost and profit are absent
    from the summary body rather than zeroed. A report body carries the period,
    scope, timezone, calculation version, computation time and how many
    day-outlet slices are still being recomputed, so a cached copy can say what
    it is. Net sales are gross sales minus discounts minus sales returns; tax
    and service charge raise revenue and never profit. The master-data feed
    schema is unchanged and remains version 1.
    2.6.0 adds brands (Fase 2 paritas): a company-scoped, pull-only feed of
    flat product labels, and ProductRow gains a nullable brand_id. Both are
    additive; a device on an older schema ignores the new column, and the
    master-data feed schema is still version 1.
    2.7.0 adds customers (Fase 2 paritas): a company-scoped feed a till both
    pulls and pushes. The push side is insert-only — id is the idempotency
    key, an existing id is left alone rather than overwritten, and there is
    no revision because editing an existing customer is Backoffice-only and
    this entity does not carry edits. Additive; the master-data feed schema
    is still version 1.
    2.8.0 adds business settings, custom roles and the pricing engine (Fase 3
    paritas), additively. New pull feeds: roles, business_settings,
    outlet_settings (outlet-scoped, keyed by outlet_id), sales_types,
    product_sales_type_prices, outlet_product_sales_type_prices
    (outlet-scoped), payment_methods, payment_groups and discounts; EmployeeRow
    gains role_id. List-valued columns (roles.permissions,
    payment_groups.method_ids, outlet_settings.sales_type_ids) travel as one
    comma-separated string so a till stores them as text; an empty string is
    an empty list and null on sales_type_ids means every active sales type.
    Tenant gains timezone (one of Asia/Jakarta, Asia/Makassar, Asia/Jayapura).
    Order gains an optional pricing snapshot (pricing_version, pricing,
    tax_included, rounding_amount), sales type, payment method, served-by and
    named-discount snapshots and tz_offset_minutes; OrderItem gains the
    per-line breakdown. The header equation is now total = subtotal - discount
    + tax - tax_included + service_charge_amount + rounding_amount, which is
    the old equation whenever the two new fields are absent. For
    pricing_version 2 the lines must also add up to the header, or the row is
    rejected; a disagreement between the server's recomputation of the
    snapshot and the figures sent is FLAGGED on the order, never rejected.
    payment_method stays the method KIND (cash, card, qris, ewallet, transfer,
    other) so drawer arithmetic keeps comparing to cash. Every call may carry
    X-Device-Capabilities; the Backoffice uses what each device last reported
    to refuse turning on a feature an active device cannot honour.
    2.9.0 adds saved bills and the restaurant order cycle (Fase 4 paritas),
    additively. A bill is not a receipt: two push-only entities carry it,
    bills (a mutable snapshot at a revision, owned by one till, fenced by
    owner_generation) and kitchen_dispatches (an immutable batch of lines sent
    to the kitchen, with the sale stock movements it consumed; only its kitchen
    status moves forward afterwards). Push them in the order bills,
    kitchen_dispatches, orders. Saving a bill takes no money and moves no stock;
    a dispatch consumes stock exactly once; the receipt that settles a bill
    names it in bill_id, each OrderItem names its bill_line_id, and it carries
    no sale movement of its own. A snapshot or dispatch from a till that no
    longer owns the bill is rejected with bill_not_owned. New till endpoints
    list the outlet's open bills and seatings, park a bill on the server and
    claim it on another till, and open or close a table seating; all take the
    cashier token, and an operation or seating id makes a retry return the
    first answer. OutletSettingsRow gains bill_model (legacy or v1), switched
    on only once every active till of the branch reports bills-v1. PushResult
    gains effects (stock_seq and balance_after per movement committed with a
    dispatch or receipt).
    Outlet-scoped feeds page and count per bound outlet only.
    All successful responses are JSON objects.
    Timestamps are epoch milliseconds, money is integer rupiah. Identity comes
    exclusively from the bearer token. Unknown pull keys must be ignored.
    A pull cursor advances only after rows and cursor commit together locally;
    /sync/changes cursors are hints and MUST NOT be saved as applied cursors.
    Push rows carry a monotonically increasing revision per entity id. Snapshot
    the payload and revision atomically into the outbox. Acknowledge only the
    matching sent revision; an edit made during HTTP must remain queued.
    Exact retries are accepted, including closed sessions and settled orders.
    Unknown/missing/invalid results, transport errors and non-object bodies
    retain the outbox. Rejected rows move atomically to recoverable dead-letter.
servers:
  - url: /api/v2
security:
  - deviceToken: []
paths:
  /devices/activate:
    post:
      operationId: activateDevice
      security: []
      parameters: [{$ref: '#/components/parameters/DeviceCapabilities'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateRequest'}
      responses:
        '200':
          description: One-time token and binding. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivateResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /devices/me:
    get:
      operationId: getDevice
      parameters: [{$ref: '#/components/parameters/DeviceCapabilities'}]
      responses:
        '200':
          description: Current binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        default: {$ref: '#/components/responses/Error'}
  /till/login:
    post:
      operationId: tillLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TillLoginRequest'}
      responses:
        '200':
          description: Short-lived cashier credential. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillLoginResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/sessions/open:
    post:
      operationId: openTillSession
      parameters: [{$ref: '#/components/parameters/CashierToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Session'}
      responses:
        '200':
          description: Claimed session and receipt range. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillSessionResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/sessions/handover:
    post:
      operationId: handoverTillSession
      parameters: [{$ref: '#/components/parameters/CashierToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TillHandoverRequest'}
      responses:
        '200':
          description: Session with the new active cashier. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillSessionResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/sessions/current:
    get:
      operationId: currentTillSession
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: local_session_id, in: query, schema: {$ref: '#/components/schemas/UUID'}, description: Locally active session used only to discover a matching forced recovery.}
      responses:
        '200':
          description: Current claim, or data null when this cashier has none. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillCurrentResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/orders:
    get:
      operationId: tillOrderHistory
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: day, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}, description: One business date. Omitting every date filter means the current business date on the merchant's clock. Combining day with from or to is refused as ambiguous_range.}
        - {name: from, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}, description: First business date of a range; at most 366 days with to.}
        - {name: to, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}, description: Last business date of a range.}
        - {name: scope, in: query, schema: {type: string, enum: [register, outlet]}, description: Defaults to register. outlet needs viewAllOrders and is refused with forbidden_scope otherwise.}
        - {name: status, in: query, schema: {type: string, enum: [sales, pending, preparing, ready, served, paid, cancelled, refunded]}, description: sales is every receipt that was not cancelled or refunded.}
        - {name: receipt_number, in: query, schema: {type: string, maxLength: 64}, description: Case-insensitive prefix of the printed receipt number.}
        - {name: cashier_id, in: query, schema: {$ref: '#/components/schemas/UUID'}, description: A cashier may only name themselves; anything else needs viewAllOrders and is refused with forbidden_cashier.}
        - {name: before, in: query, schema: {type: string, minLength: 1, maxLength: 256}, description: Opaque cursor returned by the previous page. Bound to the filter it was issued for; a cursor from an older contract is refused with invalid_cursor.}
      responses:
        '200':
          description: >-
            Receipt history for the scope the SERVER resolved, newest first, at most 100 rows.
            The body echoes scope, from and to, because a cashier who asked for a wider scope
            is given their own and has to be able to say so. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillHistoryResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/reports/summary:
    get:
      operationId: tillReportSummary
      description: >-
        The sales summary a manager already sees on the till, for any period.
        Needs viewDailySummary. Cost of goods, gross profit, margin and the
        per-cashier, per-category and per-product breakdowns are ABSENT from
        this body — not zeroed — because a manager may run the floor without
        seeing what the merchant pays for stock.
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {$ref: '#/components/parameters/ReportPeriod'}
        - {$ref: '#/components/parameters/ReportFrom'}
        - {$ref: '#/components/parameters/ReportTo'}
        - {$ref: '#/components/parameters/ReportOutlet'}
      responses:
        '200':
          description: Sales summary for the resolved period and scope. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillReportResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/reports/sales:
    get:
      operationId: tillReportSales
      description: >-
        The full financial report, including cost of goods, gross profit,
        margin and every breakdown. Needs viewFinancialReports.
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {$ref: '#/components/parameters/ReportPeriod'}
        - {$ref: '#/components/parameters/ReportFrom'}
        - {$ref: '#/components/parameters/ReportTo'}
        - {$ref: '#/components/parameters/ReportOutlet'}
      responses:
        '200':
          description: Full sales report for the resolved period and scope. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillReportResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/recoveries/{recovery_id}:
    get:
      operationId: getTillRecovery
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: recovery_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200':
          description: Recovery status for this device and its force-closed session. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillRecoveryResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/bills:
    get:
      operationId: tillBillBoard
      description: >-
        Every open bill and every open table seating of the device's outlet, in
        one consistent read. Not paged: an outlet's open bills are few, and one
        snapshot cannot miss a change the way a cursor over a moving set can.
        Needs sell or manageTables. Not a feed: nothing here is cached as an
        applied cursor.
      parameters: [{$ref: '#/components/parameters/CashierToken'}]
      responses:
        '200':
          description: The outlet's open bills and seatings. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillBillBoardResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/bills/{bill_id}:
    get:
      operationId: tillBillDetail
      description: One bill of the device's outlet with its lines and dispatches, read-only. Needs sell or manageTables.
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: bill_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200':
          description: The bill as the server holds it. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillBillDetailResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/bills/{bill_id}/park:
    post:
      operationId: parkTillBill
      description: >-
        Releases this till's open bill to the server so another till may claim
        it. Refused with sync_before_handoff unless the server already holds
        expected_revision and expected_dispatches — push first. Raises
        owner_generation, so anything this till sends for the bill afterwards is
        refused as bill_not_owned. Needs sell. A retry with the same
        operation_id returns the first answer.
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: bill_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TillBillParkRequest'}
      responses:
        '200':
          description: The bill is parked. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillBillParkResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/bills/{bill_id}/claim:
    post:
      operationId: claimTillBill
      description: >-
        Makes this till the owner of a parked open bill, under the calling
        cashier's current drawer. Exactly one of two tills claiming together
        wins; the other gets bill_not_parked. Returns the full bill, which the
        till stores before it lets anyone edit it. Needs sell and a drawer this
        cashier is active on. A retry with the same operation_id returns the
        first answer.
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: bill_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TillOperationRequest'}
      responses:
        '200':
          description: The claimed bill. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TillBillDetailResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/table-sessions:
    post:
      operationId: openTableSession
      description: >-
        Seats a table: opens its one seating, marks it occupied and publishes
        that on the table_status feed. The seating id is chosen and stored by
        the till before it asks; a retry with it returns the same seating. A
        table already seated answers table_busy. Needs sell or manageTables.
      parameters: [{$ref: '#/components/parameters/CashierToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TableSessionOpenRequest'}
      responses:
        '200':
          description: The seating. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableSessionResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /till/table-sessions/{session_id}/close:
    post:
      operationId: closeTableSession
      description: >-
        Clears a table once no bill of its seating is still open
        (open_bills_remaining otherwise). Paying a bill never does this on its
        own: guests may still be seated. Needs sell or manageTables. Closing an
        already closed seating returns it unchanged.
      parameters:
        - {$ref: '#/components/parameters/CashierToken'}
        - {name: session_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TillOperationRequest'}
      responses:
        '200':
          description: The closed seating. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableSessionResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /sync/manifest:
    get:
      operationId: getManifest
      parameters:
        - {$ref: '#/components/parameters/SchemaVersion'}
        - {$ref: '#/components/parameters/DeviceCapabilities'}
      responses:
        '200':
          description: Dependency order and application rules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Manifest'}
        default: {$ref: '#/components/responses/Error'}
  /sync/changes:
    get:
      operationId: getChanges
      parameters:
        - {$ref: '#/components/parameters/SchemaVersion'}
        - {$ref: '#/components/parameters/DeviceCapabilities'}
      responses:
        '200':
          description: Advisory watermarks; compare with locally applied cursors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Changes'}
        default: {$ref: '#/components/responses/Error'}
  /sync/pull:
    get:
      operationId: pullChanges
      parameters:
        - {$ref: '#/components/parameters/SchemaVersion'}
        - {$ref: '#/components/parameters/DeviceCapabilities'}
        - {name: entity, in: query, required: true, schema: {type: string}}
        - {name: after_seq, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
      responses:
        '200':
          description: Rows and next_seq from one database snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PullPage'}
        default: {$ref: '#/components/responses/Error'}
  /sync/push:
    post:
      operationId: pushChanges
      description: |
        At most 200 rows total and 4 MiB encoded body. Batches must put
        pos_sessions before orders, and bills before kitchen_dispatches before
        orders; stock_movements are independent of all of them and are applied
        at the token's outlet, as are table_status_events.
        Each row is independent and logged before domain processing. Results
        correlate by zero-based batch_index and row_index, even for unreadable
        ids. A transaction commits before an
        accepted/rejected result is emitted. Retry means commit is not known
        to have succeeded; resend identical bytes. The database business date
        wins over a changed retry date. Never choose tenant/outlet/register
        from a payload. Financial figures and lines are immutable after first
        acceptance; only status and its audit fields may change thereafter.
      parameters:
        - {$ref: '#/components/parameters/SchemaVersion'}
        - {$ref: '#/components/parameters/DeviceCapabilities'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushRequest'}
      responses:
        '200':
          description: Exactly one result per submitted row, in request order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /time:
    get:
      operationId: getTime
      security: []
      responses:
        '200':
          description: Server clock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerTime'}
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Database ready; Redis failure is degraded but usable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: Database unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
components:
  securitySchemes:
    deviceToken: {type: http, scheme: bearer}
  parameters:
    CashierToken:
      name: X-Cashier-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
      description: Short-lived cashier credential returned by POST /till/login.
    SchemaVersion:
      name: X-Schema-Version
      in: header
      required: true
      schema: {type: integer, minimum: 1}
      description: Missing/obsolete returns 409 device_schema_outdated; invalid returns 400.
    DeviceCapabilities:
      name: X-Device-Capabilities
      in: header
      required: false
      schema: {type: string, maxLength: 256, pattern: '^[a-z0-9-]*(,[a-z0-9-]+)*$'}
      description: >-
        Comma-separated feature tokens this build honours (pricing-v2,
        roles-v1, bills-v1). Recorded per device only when the set changes; unknown
        tokens are ignored. Absent means an app older than Fase 3, which is
        exactly what the Backoffice needs to know before it enables a feature.
    ReportPeriod:
      name: period
      in: query
      schema: {type: string, enum: [today, yesterday, last7, month, custom]}
      description: >-
        Resolved on the merchant's clock. Omitted with from and to present
        means custom; omitted entirely means today. An unknown value falls back
        to today rather than failing, because a dashboard is a glance.
    ReportFrom:
      name: from
      in: query
      schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      description: First business date; used only with period=custom. At most 366 days with to.
    ReportTo:
      name: to
      in: query
      schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      description: Last business date; used only with period=custom.
    ReportOutlet:
      name: outlet_id
      in: query
      schema: {type: string, maxLength: 64}
      description: >-
        The device's own outlet when omitted. Another outlet, or the literal
        "all" for every outlet, needs manageOutlets; otherwise the request is
        refused rather than narrowed, so a total is never quietly one branch.
  responses:
    Error:
      description: Request failed; retain all queued rows. 429/503 include Retry-After seconds.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ID: {type: string, minLength: 1, maxLength: 128}
    UUID: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
    Millis: {type: integer, format: int64, minimum: 0}
    Money: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
    Name: {type: string, minLength: 1, maxLength: 255}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Device:
      type: object
      required: [id, device_uuid, label, platform]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        device_uuid: {$ref: '#/components/schemas/ID'}
        label: {type: string, nullable: true, maxLength: 120}
        platform: {type: string, nullable: true, maxLength: 32}
    Tenant:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        timezone:
          type: string
          maxLength: 64
          description: >-
            The merchant's trading clock (IANA name; the Backoffice offers
            Asia/Jakarta, Asia/Makassar and Asia/Jayapura). A till dates its
            receipts by it when it recognises the zone; absent from a server
            older than 2.8.0, and an unrecognised zone, both leave the device
            clock in charge as before.
    Outlet:
      type: object
      required: [id, name, address, phone]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        address: {type: string, nullable: true}
        phone: {type: string, nullable: true}
    Register:
      type: object
      required: [id, outlet_id, name, table_service]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        outlet_id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        table_service: {type: boolean}
    Binding:
      type: object
      required: [device, tenant, outlet, pos_register]
      properties:
        device: {$ref: '#/components/schemas/Device'}
        tenant: {$ref: '#/components/schemas/Tenant'}
        outlet: {$ref: '#/components/schemas/Outlet'}
        pos_register: {$ref: '#/components/schemas/Register'}
    ActivateRequest:
      type: object
      additionalProperties: false
      required: [code, device_uuid]
      properties:
        code: {type: string, minLength: 12, maxLength: 12}
        device_uuid: {$ref: '#/components/schemas/ID'}
        label: {type: string, nullable: true, maxLength: 120}
        platform: {type: string, nullable: true, maxLength: 32}
    ActivateResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - {$ref: '#/components/schemas/Binding'}
            - type: object
              required: [token, token_expires_at_ms]
              properties:
                token: {type: string}
                token_expires_at_ms: {$ref: '#/components/schemas/Millis'}
    MeResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Binding'}
    ManifestEntity:
      type: object
      required: [name, scope, key, depends_on, pull, push, apply]
      properties:
        name: {type: string}
        scope: {type: string, enum: [company, outlet]}
        key: {type: array, items: {type: string}}
        depends_on: {type: array, items: {type: string}}
        pull: {type: boolean}
        push: {type: boolean}
        apply: {type: string, enum: [upsert, replace]}
    Manifest:
      type: object
      required: [schema_version, entities]
      properties:
        schema_version: {type: integer}
        entities: {type: array, items: {$ref: '#/components/schemas/ManifestEntity'}}
    Changes:
      type: object
      required: [cursors, device_revision, server_time_ms, next_poll_ms]
      properties:
        cursors: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
        device_revision: {$ref: '#/components/schemas/Millis'}
        server_time_ms: {$ref: '#/components/schemas/Millis'}
        next_poll_ms: {type: integer, format: int64, minimum: 1}
    PullPage:
      type: object
      required: [entity, rows, next_seq, has_more, schema_version]
      properties:
        entity: {type: string}
        rows:
          type: array
          items:
            type: object
            description: Entity-specific Row schemas below are checked against the registry. All columns are required; nullable fields still appear as null.
            x-go-type: rawjson.RawMessage
            x-go-type-import: {path: encoding/json, name: rawjson}
        next_seq: {type: integer, format: int64, minimum: 0}
        has_more: {type: boolean}
        schema_version: {type: integer}
    ServerTime:
      type: object
      required: [server_time_ms]
      properties:
        server_time_ms: {$ref: '#/components/schemas/Millis'}
    Health:
      type: object
      required: [status, service, database, cache]
      properties:
        status: {type: string}
        service: {type: string}
        database: {type: string}
        cache: {type: string}
    TillLoginRequest:
      type: object
      additionalProperties: false
      required: [employee_id, pin]
      properties:
        employee_id: {$ref: '#/components/schemas/UUID'}
        pin: {type: string, pattern: '^\d{4}$'}
    TillLoginData:
      type: object
      required: [token, expires_at_ms]
      properties:
        token: {type: string}
        expires_at_ms: {$ref: '#/components/schemas/Millis'}
    TillLoginResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TillLoginData'}
    TillHandoverRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
    TillSessionData:
      type: object
      required: [session, receipt_start, receipt_end]
      properties:
        session: {$ref: '#/components/schemas/Session'}
        receipt_start: {type: integer, format: int64, minimum: 1}
        receipt_end: {type: integer, format: int64, minimum: 1}
        current_employee_id: {allOf: [{$ref: '#/components/schemas/UUID'}], nullable: true}
    TillSessionResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TillSessionData'}
    TillCurrentResponse:
      type: object
      required: [data]
      properties:
        data: {allOf: [{$ref: '#/components/schemas/TillSessionData'}], nullable: true}
        recovery: {allOf: [{$ref: '#/components/schemas/TillRecoveryPointer'}], nullable: true}
    TillRecoveryPointer:
      type: object
      required: [id, session_id, forced_at_ms]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        session_id: {$ref: '#/components/schemas/UUID'}
        forced_at_ms: {$ref: '#/components/schemas/Millis'}
    TillHistoryPage:
      type: object
      required: [rows, next, server_time_ms, scope, from, to]
      properties:
        rows: {type: array, items: {type: object, additionalProperties: true}}
        next: {type: string, maxLength: 256}
        server_time_ms: {$ref: '#/components/schemas/Millis'}
        scope: {type: string, enum: [register, outlet], description: 'What the server applied, which may be narrower than what was asked for.'}
        from: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        to: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    TillHistoryResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TillHistoryPage'}
    TillReportPeriod:
      type: object
      required: [from, to, days]
      properties:
        from: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        to: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        days: {type: integer, minimum: 1}
    TillReportScope:
      type: object
      required: [outlet_id, outlet_name, all_outlets]
      properties:
        outlet_id: {type: string}
        outlet_name: {type: string}
        all_outlets: {type: boolean}
    TillReportSales:
      type: object
      description: >-
        The waterfall, read top to bottom. net_sales = gross_sales - discounts
        - sales_returns; revenue = net_sales + tax + service_charge. gross_sales
        includes a receipt that was later refunded, and sales_returns takes it
        out again, so a refund is visible rather than the day silently
        shrinking. refunded_amount is the money handed back, which includes tax
        and is therefore not the same number as sales_returns. cancelled_amount
        is shown separately and is never subtracted from the waterfall.
      required: [gross_sales, discounts, sales_returns, net_sales, tax, service_charge, revenue, order_count, average_sale, items_sold]
      properties:
        gross_sales: {$ref: '#/components/schemas/Money'}
        discounts: {$ref: '#/components/schemas/Money'}
        sales_returns: {$ref: '#/components/schemas/Money'}
        net_sales: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        service_charge: {$ref: '#/components/schemas/Money'}
        tax_included: {allOf: [{$ref: '#/components/schemas/Money'}], description: 'Fase 3. Tax already inside inclusive prices; taken out of net sales, so gross - discounts - sales_returns - tax_included = net_sales.'}
        rounding: {type: integer, format: int64, description: 'Fase 3. Final rounding collected (may be negative); part of revenue, never of sales.'}
        revenue: {$ref: '#/components/schemas/Money'}
        order_count: {type: integer, format: int64}
        average_sale: {$ref: '#/components/schemas/Money'}
        items_sold: {type: integer, format: int64}
        discounted: {type: integer, format: int64}
        cancelled_count: {type: integer, format: int64}
        cancelled_amount: {$ref: '#/components/schemas/Money'}
        refunded_count: {type: integer, format: int64}
        refunded_amount: {$ref: '#/components/schemas/Money'}
    TillReportProfit:
      type: object
      description: Present only on /till/reports/sales. margin is null when there are no net sales to divide by.
      required: [cost_of_goods, gross_profit, cost_coverage]
      properties:
        cost_of_goods: {$ref: '#/components/schemas/Money'}
        gross_profit: {type: integer, format: int64}
        cost_coverage: {type: number, format: double, minimum: 0, maximum: 1}
        margin: {type: number, format: double, nullable: true}
    TillReport:
      type: object
      required: [period, scope, timezone, calculation_version, pending_slices, incomplete, server_time_ms, sales]
      properties:
        period: {$ref: '#/components/schemas/TillReportPeriod'}
        scope: {$ref: '#/components/schemas/TillReportScope'}
        timezone: {type: string}
        calculation_version: {type: integer, description: Which rules produced these figures. 2 is the Fase 1 waterfall.}
        computed_at_ms: {type: integer, format: int64, nullable: true, description: Null when the range holds no computed rollup at all.}
        pending_slices: {type: integer, format: int64, description: Day-outlet slices in range with changes not yet rolled up.}
        incomplete: {type: boolean, description: True while some day in range is still computed under the old rules; the waterfall columns are not final.}
        anomaly_count: {type: integer, format: int64, description: 'Receipts whose own arithmetic does not close. Reported, never repaired.'}
        server_time_ms: {$ref: '#/components/schemas/Millis'}
        sales: {$ref: '#/components/schemas/TillReportSales'}
        profit: {$ref: '#/components/schemas/TillReportProfit'}
        by_hour: {type: array, items: {type: object, additionalProperties: true}}
        by_weekday: {type: array, items: {type: object, additionalProperties: true}, description: 'Derived from the business date, so a sale after midnight belongs to its trading day. weekday is 0 for Sunday.'}
        by_day: {type: array, items: {type: object, additionalProperties: true}}
        by_outlet: {type: array, items: {type: object, additionalProperties: true}}
        by_payment: {type: array, items: {type: object, additionalProperties: true}}
        by_sales_type: {type: array, items: {type: object, additionalProperties: true}, description: 'Fase 3. Net sales and revenue per sales type.'}
        by_cashier: {type: array, items: {type: object, additionalProperties: true}}
        by_category: {type: array, items: {type: object, additionalProperties: true}}
        by_brand: {type: array, items: {type: object, additionalProperties: true}}
        by_product: {type: array, items: {type: object, additionalProperties: true}}
        by_product_in_category: {type: array, items: {type: object, additionalProperties: true}}
        adjustments: {type: array, items: {type: object, additionalProperties: true}}
    TillReportResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TillReport'}
    TillRecoveryItem:
      type: object
      required: [id, entity, entity_id, revision, status, created_at_ms]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        entity: {type: string}
        entity_id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        status:
          type: string
          enum: [pending, accepted, discarded]
          x-enum-varnames: [RecoveryItemPending, RecoveryItemAccepted, RecoveryItemDiscarded]
        decision_reason: {type: string, nullable: true}
        created_at_ms: {$ref: '#/components/schemas/Millis'}
        decided_at_ms: {allOf: [{$ref: '#/components/schemas/Millis'}], nullable: true}
    TillRecovery:
      type: object
      required: [id, session_id, status, forced_at_ms, items]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        session_id: {$ref: '#/components/schemas/UUID'}
        status:
          type: string
          enum: [open, reconciled]
          x-enum-varnames: [RecoveryOpen, RecoveryReconciled]
        forced_at_ms: {$ref: '#/components/schemas/Millis'}
        reconciliation_basis: {type: string, nullable: true, enum: [device_checked, device_unavailable]}
        items: {type: array, items: {$ref: '#/components/schemas/TillRecoveryItem'}}
    TillRecoveryResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TillRecovery'}
    PushRequest:
      type: object
      additionalProperties: false
      required: [batches]
      properties:
        batches:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/PushBatch'}
    PushBatch:
      type: object
      additionalProperties: false
      required: [entity, rows]
      properties:
        entity: {type: string, minLength: 1}
        rows:
          type: array
          minItems: 1
          maxItems: 200
          items:
            description: Session or Order; invalid rows are logged and individually rejected.
            x-go-type: rawjson.RawMessage
            x-go-type-import: {path: encoding/json, name: rawjson}
    PushResponse:
      type: object
      required: [results, server_time_ms]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/PushResult'}}
        server_time_ms: {$ref: '#/components/schemas/Millis'}
    PushResult:
      type: object
      required: [batch_index, row_index, entity, status]
      properties:
        batch_index: {type: integer, minimum: 0}
        row_index: {type: integer, minimum: 0}
        entity: {type: string}
        id: {type: string}
        revision: {type: integer, format: int64}
        status: {type: string, enum: [accepted, rejected, retry]}
        code:
          type: string
          enum: [duplicate, settled, session_closed, recovery_required, unknown_entity, schema_rejected, stale_revision, register_busy, dependency_pending, server_unavailable, archived, bill_not_owned]
        message: {type: string}
        recovery_id: {allOf: [{$ref: '#/components/schemas/UUID'}], nullable: true}
        inserted: {type: boolean}
        business_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        holder_session_id: {type: string}
        holder_employee_name: {type: string}
        stock_seq:
          type: integer
          format: int64
          description: For an accepted stock movement, the outlet_stock sync_seq of its product after the movement was applied. A snapshot at or past it already includes the movement.
        balance_after:
          type: integer
          format: int64
          description: For an accepted stock movement, the outlet's quantity immediately after it (a count's computed delta included).
        status_seq:
          type: integer
          format: int64
          description: For an accepted table status event, the table_status sync_seq it was recorded at. A snapshot at or past it already reflects the event.
        outcome:
          type: string
          enum: [applied, superseded]
          description: For an accepted table status event, whether the table took its status (applied) or kept a later change by another till (superseded).
        effects:
          type: array
          maxItems: 400
          description: For an accepted kitchen dispatch, bill or receipt, what each stock movement it committed did — the same stock_seq and balance_after a standalone movement returns, so the till stops counting it once a snapshot includes it.
          items: {$ref: '#/components/schemas/PushEffect'}
    PushEffect:
      type: object
      required: [id, stock_seq, balance_after]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        stock_seq: {type: integer, format: int64}
        balance_after: {type: integer, format: int64}
    Session:
      type: object
      additionalProperties: false
      required: [id, revision, employee_name, opened_at_ms, opening_cash]
      properties:
        order_count: {type: integer, format: int64, minimum: 0, description: Required when closing an online-claimed session. Number of durably recorded receipts in the drawer.}
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        employee_id: {type: string, nullable: true}
        employee_name: {$ref: '#/components/schemas/Name'}
        pos_name: {type: string, nullable: true, maxLength: 255}
        outlet_name: {type: string, nullable: true, maxLength: 255}
        opened_at_ms: {$ref: '#/components/schemas/Millis'}
        opening_cash: {$ref: '#/components/schemas/Money'}
        closed_at_ms: {type: integer, format: int64, minimum: 0, nullable: true}
        counted_cash: {type: integer, format: int64, minimum: 0, nullable: true}
        expected_cash: {type: integer, format: int64, nullable: true}
        closed_by_id: {type: string, nullable: true}
        closed_by_name: {type: string, nullable: true, maxLength: 255}
        note: {type: string, nullable: true, maxLength: 2000}
    Order:
      type: object
      additionalProperties: false
      required: [id, revision, business_date, number, placed_at_ms, type, status, pos_session_id, subtotal, discount, tax, service_charge_amount, total, amount_paid, payment_method, cashier_name, items]
      properties:
        stock_movements: {type: array, maxItems: 400, items: {$ref: '#/components/schemas/StockMovement'}, description: Complete immutable sale and optional return movements committed atomically with this receipt.}
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        business_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        number: {type: string, minLength: 1, maxLength: 64}
        placed_at_ms: {$ref: '#/components/schemas/Millis'}
        server_time_delta_ms: {type: integer, format: int64}
        type: {type: string, minLength: 1, maxLength: 32}
        status: {type: string, enum: [pending, preparing, ready, served, paid, cancelled, refunded]}
        pos_session_id: {$ref: '#/components/schemas/UUID'}
        table_id: {type: string, nullable: true}
        table_name: {type: string, nullable: true, maxLength: 255}
        customer_id: {type: string, nullable: true}
        customer_name: {type: string, nullable: true, maxLength: 255}
        note: {type: string, nullable: true, maxLength: 2000}
        subtotal: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        service_charge_amount: {$ref: '#/components/schemas/Money'}
        total: {$ref: '#/components/schemas/Money'}
        amount_paid: {$ref: '#/components/schemas/Money'}
        pb1_rate: {type: number, format: double, minimum: 0, maximum: 100, nullable: true}
        service_charge_rate: {type: number, format: double, minimum: 0, maximum: 100, nullable: true}
        payment_method: {type: string, minLength: 1, maxLength: 32}
        promo_name: {type: string, nullable: true, maxLength: 255}
        cashier_id: {type: string, nullable: true}
        cashier_name: {$ref: '#/components/schemas/Name'}
        outlet_name: {type: string, nullable: true, maxLength: 255}
        pos_name: {type: string, nullable: true, maxLength: 255}
        authorized_by: {type: string, nullable: true, maxLength: 255}
        void_reason: {type: string, nullable: true, maxLength: 2000}
        refunded_amount: {type: integer, format: int64, minimum: 0, nullable: true}
        pricing_version: {type: integer, minimum: 1, maximum: 2, description: 'Absent or 1: the legacy cart math. 2: the Fase 3 engine; its lines must reconcile with the header.'}
        pricing: {$ref: '#/components/schemas/PricingSnapshot'}
        tax_included: {allOf: [{$ref: '#/components/schemas/Money'}], description: The part of tax already inside the prices (inclusive mode). Never more than tax.}
        rounding_amount: {type: integer, format: int64, minimum: -1000000, maximum: 1000000, description: Final rounding of what the customer pays; may be negative.}
        tz_offset_minutes: {type: integer, minimum: -720, maximum: 840, description: The merchant clock the business date was read from.}
        sales_type_id: {type: string, nullable: true}
        sales_type_name: {type: string, nullable: true, maxLength: 255}
        payment_method_id: {type: string, nullable: true}
        payment_method_name: {type: string, nullable: true, maxLength: 255}
        payment_reference: {type: string, nullable: true, maxLength: 120}
        served_by_id: {type: string, nullable: true}
        served_by_name: {type: string, nullable: true, maxLength: 255}
        discount_id: {type: string, nullable: true}
        discount_name: {type: string, nullable: true, maxLength: 255}
        discount_authorized_by_id: {type: string, nullable: true}
        discount_authorized_by_name: {type: string, nullable: true, maxLength: 255}
        bill_id: {allOf: [{$ref: '#/components/schemas/UUID'}], nullable: true, description: 'Fase 4. The bill this receipt settles. Every line of the bill must already be dispatched on the server, and the receipt carries no sale movement of its own: the dispatches consumed the stock.'}
        items: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/OrderItem'}}
    PricingSnapshot:
      type: object
      additionalProperties: false
      description: The configuration the till priced the bill with, frozen at checkout so the server can recompute it.
      required: [tax_mode, service_rate_bp, service_taxable, rounding_unit, rounding_mode]
      properties:
        tax_mode: {type: string, enum: [exclusive, inclusive]}
        service_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        service_taxable: {type: boolean}
        rounding_unit: {type: integer, minimum: 0, maximum: 100000}
        rounding_mode: {type: string, enum: [nearest, up, down]}
        bill_discount: {$ref: '#/components/schemas/DiscountSpec'}
    DiscountSpec:
      type: object
      additionalProperties: false
      nullable: true
      required: [kind, value]
      properties:
        kind: {type: string, enum: [percent, amount]}
        value: {type: integer, format: int64, minimum: 0, maximum: 1000000000000, description: 'Basis points for percent, rupiah for amount.'}
    OrderItem:
      type: object
      description: unit_price is the final per-unit snapshot including variant/modifier deltas; never add modifier price_delta to it again. subtotal equals sum(unit_price * quantity).
      additionalProperties: false
      required: [id, product_name, unit_price, quantity, modifiers]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        product_id: {type: string, nullable: true}
        product_name: {$ref: '#/components/schemas/Name'}
        variant_name: {type: string, nullable: true, maxLength: 255}
        unit_price: {$ref: '#/components/schemas/Money'}
        unit_cost: {type: integer, format: int64, minimum: 0, nullable: true}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
        note: {type: string, nullable: true, maxLength: 2000}
        category_id: {type: string, nullable: true}
        category_name: {type: string, nullable: true, maxLength: 255}
        brand_id: {type: string, nullable: true}
        custom: {type: boolean, description: 'A custom amount typed at the till; no product, no stock effect.'}
        base_price: {allOf: [{$ref: '#/components/schemas/Money'}], description: The resolved price before variant and modifier deltas.}
        price_source: {type: string, enum: [base, sales_type, outlet_sales_type, custom]}
        tax_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        discount: {$ref: '#/components/schemas/DiscountSpec'}
        line_discount_id: {type: string, nullable: true}
        line_discount_name: {type: string, nullable: true, maxLength: 255}
        line_discount_authorized_by_id: {type: string, nullable: true}
        line_discount_authorized_by_name: {type: string, nullable: true, maxLength: 255}
        line_discount: {$ref: '#/components/schemas/Money'}
        bill_discount_share: {$ref: '#/components/schemas/Money'}
        service_share: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        tax_included: {$ref: '#/components/schemas/Money'}
        net_amount: {$ref: '#/components/schemas/Money'}
        bill_line_id: {allOf: [{$ref: '#/components/schemas/UUID'}], nullable: true, description: 'Fase 4. The bill line this receipt line settles, when the receipt names a bill_id.'}
        modifiers: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/OrderItemModifier'}}
    OrderItemModifier:
      type: object
      additionalProperties: false
      required: [id, group_name, option_name, price_delta, sort_order]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        group_name: {$ref: '#/components/schemas/Name'}
        option_name: {$ref: '#/components/schemas/Name'}
        price_delta: {type: integer, format: int64, minimum: -1000000000000, maximum: 1000000000000}
        sort_order: {type: integer, minimum: 0}
    Bill:
      type: object
      additionalProperties: false
      description: |
        Fase 4. One bill as its owning till last saved it, at a revision. The
        till numbers revisions itself and every save is a newer one; the server
        keeps the last accepted snapshot and accepts an exact retry of it. The
        snapshot is refused as bill_not_owned when this till is not the owner or
        owner_generation is not the bill's current one; a line already
        dispatched must appear unchanged in every later revision. status
        cancelled is terminal and needs cancel; closed is never pushed — the
        settling receipt closes the bill. Saving takes no money and moves no
        stock.
      required: [id, revision, owner_generation, number, status, pos_session_id, opened_at_ms, type, created_by_name, pricing, lines]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        owner_generation: {type: integer, format: int64, minimum: 1}
        number: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, enum: [open, cancelled]}
        pos_session_id: {$ref: '#/components/schemas/UUID'}
        opened_at_ms: {$ref: '#/components/schemas/Millis'}
        type: {type: string, minLength: 1, maxLength: 32}
        sales_type_id: {type: string, nullable: true}
        sales_type_name: {type: string, nullable: true, maxLength: 255}
        table_session_id: {allOf: [{$ref: '#/components/schemas/UUID'}], nullable: true}
        table_id: {type: string, nullable: true}
        table_name: {type: string, nullable: true, maxLength: 255}
        customer_id: {type: string, nullable: true}
        customer_name: {type: string, nullable: true, maxLength: 255}
        served_by_id: {type: string, nullable: true}
        served_by_name: {type: string, nullable: true, maxLength: 255}
        note: {type: string, nullable: true, maxLength: 2000}
        created_by_id: {type: string, nullable: true}
        created_by_name: {$ref: '#/components/schemas/Name'}
        pricing: {$ref: '#/components/schemas/BillPricing'}
        lines: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/BillLine'}}
        cancel: {$ref: '#/components/schemas/BillCancel'}
    BillPricing:
      type: object
      additionalProperties: false
      description: The configuration frozen when the bill was first saved, so a sync that changes a rate never re-prices a bill a guest was already quoted.
      required: [version, tax_mode, service_rate_bp, service_taxable, rounding_unit, rounding_mode, default_tax_rate_bp, discount_source]
      properties:
        version: {type: integer, minimum: 1, maximum: 2}
        tax_mode: {type: string, enum: [exclusive, inclusive]}
        service_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        service_taxable: {type: boolean}
        rounding_unit: {type: integer, minimum: 0, maximum: 100000}
        rounding_mode: {type: string, enum: [nearest, up, down]}
        default_tax_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        bill_discount: {$ref: '#/components/schemas/DiscountSpec'}
        discount_source: {type: string, enum: [none, promo, manual, named]}
        promo_id: {type: string, nullable: true}
        promo_name: {type: string, nullable: true, maxLength: 255}
        discount_id: {type: string, nullable: true}
        discount_name: {type: string, nullable: true, maxLength: 255}
        discount_authorized_by_id: {type: string, nullable: true}
        discount_authorized_by_name: {type: string, nullable: true, maxLength: 255}
    BillLine:
      type: object
      additionalProperties: false
      description: One line of a bill, priced when it was added. unit_price already includes variant and modifier deltas.
      required: [id, seq, product_name, unit_price, quantity, custom, modifiers]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        seq: {type: integer, minimum: 0, maximum: 100000}
        product_id: {type: string, nullable: true}
        product_name: {$ref: '#/components/schemas/Name'}
        variant_id: {type: string, nullable: true, maxLength: 128}
        variant_name: {type: string, nullable: true, maxLength: 255}
        unit_price: {$ref: '#/components/schemas/Money'}
        base_price: {$ref: '#/components/schemas/Money'}
        price_source: {type: string, enum: [base, sales_type, outlet_sales_type, custom]}
        tax_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        unit_cost: {type: integer, format: int64, minimum: 0, nullable: true}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
        note: {type: string, nullable: true, maxLength: 2000}
        custom: {type: boolean}
        category_id: {type: string, nullable: true}
        category_name: {type: string, nullable: true, maxLength: 255}
        brand_id: {type: string, nullable: true}
        discount: {$ref: '#/components/schemas/DiscountSpec'}
        line_discount_id: {type: string, nullable: true}
        line_discount_name: {type: string, nullable: true, maxLength: 255}
        line_discount_authorized_by_id: {type: string, nullable: true}
        line_discount_authorized_by_name: {type: string, nullable: true, maxLength: 255}
        modifiers: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/BillLineModifier'}}
    BillLineModifier:
      type: object
      additionalProperties: false
      required: [group_name, option_name, price_delta]
      properties:
        group_id: {type: string, nullable: true, maxLength: 128}
        group_name: {$ref: '#/components/schemas/Name'}
        option_id: {type: string, nullable: true, maxLength: 128}
        option_name: {$ref: '#/components/schemas/Name'}
        price_delta: {type: integer, format: int64, minimum: -1000000000000, maximum: 1000000000000}
    BillCancel:
      type: object
      additionalProperties: false
      nullable: true
      description: |
        Why an unpaid bill was cancelled, who allowed it and, for every line
        already sent to the kitchen, whether it came back to the shelf
        (restock) or was made and thrown away (waste). Waste is a
        classification of a consumption that already happened, never a second
        debit. stock_movements holds only the voidReturn movements of the
        restocked lines, bounded by what the bill's dispatches consumed.
      required: [reason, authorized_by, cancelled_at_ms, decisions, stock_movements]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        authorized_by: {$ref: '#/components/schemas/Name'}
        authorized_by_id: {type: string, nullable: true}
        cancelled_at_ms: {$ref: '#/components/schemas/Millis'}
        decisions:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [bill_line_id, disposition]
            properties:
              bill_line_id: {$ref: '#/components/schemas/UUID'}
              disposition: {type: string, enum: [restock, waste]}
        stock_movements: {type: array, maxItems: 400, items: {$ref: '#/components/schemas/StockMovement'}}
    KitchenDispatch:
      type: object
      additionalProperties: false
      description: |
        Fase 4. Lines of one bill confirmed for the kitchen, as one immutable
        batch, and the sale movements that consumed their stock — committed in
        one transaction, exactly once. lines repeats each bill line exactly as
        the bill holds it; a line the server does not hold yet, or holds
        differently, answers dependency_pending until the bill snapshot
        arrives. A later revision may change status only, forward (queued,
        preparing, ready, served); cancelled comes from cancelling the bill.
      required: [id, revision, bill_id, owner_generation, pos_session_id, occurred_at_ms, employee_name, status, status_changed_at_ms, lines, stock_movements]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, format: int64, minimum: 1}
        bill_id: {$ref: '#/components/schemas/UUID'}
        owner_generation: {type: integer, format: int64, minimum: 1}
        pos_session_id: {$ref: '#/components/schemas/UUID'}
        occurred_at_ms: {$ref: '#/components/schemas/Millis'}
        employee_id: {type: string, nullable: true}
        employee_name: {type: string, maxLength: 255}
        status: {type: string, enum: [queued, preparing, ready, served, cancelled]}
        status_changed_at_ms: {$ref: '#/components/schemas/Millis'}
        lines: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/BillLine'}}
        stock_movements: {type: array, maxItems: 400, items: {$ref: '#/components/schemas/StockMovement'}}
    TillOperationRequest:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id: {$ref: '#/components/schemas/UUID'}
