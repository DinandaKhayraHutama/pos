        line_ids: {type: array, items: {$ref: '#/components/schemas/UUID'}}
        dispatch:
          allOf: [{$ref: '#/components/schemas/KitchenDispatch'}]
          description: The dispatch exactly as it was accepted, at its current status and revision. A till that claims the bill keeps it, so it can report later kitchen progress for a batch another till sent — a status change must repeat the batch's lines and stock unchanged.
    TillBillDetail:
      type: object
      required: [summary, bill, dispatches]
      properties:
        summary: {$ref: '#/components/schemas/TillBillSummary'}
        bill: {$ref: '#/components/schemas/Bill'}
